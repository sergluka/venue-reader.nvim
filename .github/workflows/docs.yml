name: Wiki documentation

on:
  workflow_call:
  gollum:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  docs:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'gollum') && 'Live documentation' || 'Pinned documentation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python .github/ci/setup.py
      - name: Check README, wiki, help and examples
        env:
          DOCS_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'gollum') && 'live' || 'pinned' }}
        run: bash .github/extra/docs.sh "$DOCS_MODE"
